name: Fix Training Count
on:
  push:
    paths-ignore:
      - 'training.html'
      - '__temp__'
      - '__temp2__'
      - '__temp3__'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only real training records
        run: |
          python - <<'PY'
          p='training.html'
          s=open(p,encoding='utf-8').read()
          old='allData=await res.json();'
          new='allData=(await res.json()).filter(r=>parseDate(r[C.date]));'
          if old not in s:
              raise SystemExit('target text not found')
          s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training.html
          git commit -m 'Fix Training KPI to actual 1540 records'
          git push
