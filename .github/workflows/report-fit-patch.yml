name: Final Report Chart Fit
on:
  push:
    paths:
      - 'report-fit-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fit charts on A4 pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hse-report-generator.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("y+5,115)+8", "y+5,60)+6")
          s=s.replace("y+3,78)+5", "y+3,58)+4")
          s=s.replace("y,112);", "y,58);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hse-report-generator.js
          git commit -m 'Fit report charts to A4 layout' || true
          git push
