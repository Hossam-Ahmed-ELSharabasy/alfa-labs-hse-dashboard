name: Add mobile header logos
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply mobile Alfa Labs header logos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch CAPA and Training headers
        shell: python
        run: |
          from pathlib import Path

          # CAPA: add the same Alfa Labs logo to the existing mobile header.
          p = Path('capa.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* MASTER MOBILE LOGO */\n.mobile-header-logo{display:none;width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;box-shadow:0 2px 7px rgba(8,43,82,.12);flex:0 0 42px}\n@media(max-width:800px){.mobile-header-logo{display:block}.header{justify-content:flex-start}.header-title{min-width:0;flex:1}.header-title h2,.header-title p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}\n'''
          if '/* MASTER MOBILE LOGO */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          marker='<button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open menu">☰</button>'
          if marker in s and 'class="mobile-header-logo"' not in s:
              s=s.replace(marker,marker+'<img class="mobile-header-logo" src="./LOGOG.png" alt="Alfa Labs Logo">',1)
          p.write_text(s,encoding='utf-8')

          # Training: add the same logo to the unified mobile header.
          p = Path('training.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* MASTER MOBILE LOGO */\n.mobile-header-logo{display:none;width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;box-shadow:0 2px 7px rgba(8,43,82,.12);flex:0 0 42px}\n@media(max-width:700px){.mobile-header-logo{display:block}.unified-left{min-width:0}.unified-title{min-width:0;flex:1}}\n'''
          if '/* MASTER MOBILE LOGO */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          marker='<button class="menu" id="menu" type="button" aria-label="Open menu" aria-expanded="false">☰</button>'
          if marker in s and 'class="mobile-header-logo"' not in s:
              s=s.replace(marker,marker+'<img class="mobile-header-logo" src="./LOGOG.png" alt="Alfa Labs Logo">',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capa.html training.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply mobile Alfa Labs header logos"
          git push
