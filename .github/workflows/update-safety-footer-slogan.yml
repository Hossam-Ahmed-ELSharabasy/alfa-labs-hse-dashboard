name: Update Safety Footer Slogan
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message != 'Update safety footer slogan'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace footer slogan
        shell: python
        run: |
          from pathlib import Path
          files = ['index.html','capa.html','training.html']
          replacements = {
            'Safer Today ... A Healthier Tomorrow': 'SAFETY FIRST • SAFETY IS EVERYONE’S RESPONSIBILITY',
            'SAFER TODAY ... A HEALTHIER TOMORROW': 'SAFETY FIRST • SAFETY IS EVERYONE’S RESPONSIBILITY',
            'Safer Today A Healthier Tomorrow': 'SAFETY FIRST • SAFETY IS EVERYONE’S RESPONSIBILITY',
            'SAFER TODAY A HEALTHIER TOMORROW': 'SAFETY FIRST • SAFETY IS EVERYONE’S RESPONSIBILITY',
          }
          for name in files:
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            for old,new in replacements.items(): s=s.replace(old,new)
            p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html capa.html training.html
          git diff --cached --quiet && exit 0
          git commit -m "Update safety footer slogan"
          git push
