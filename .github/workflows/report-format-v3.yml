name: Refine Live HSE Report
on:
  push:
    paths:
      - '.github/workflows/report-format-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild report layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hse-report-generator.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function report(){')
          end=s.index("b.addEventListener('click',report);")
          helper=r'''function hbars(labels,vals,title){const c=cv(),x=head(c,title),data=labels.map((v,i)=>[String(v),Number(vals[i]||0)]).slice(0,8),max=Math.max(...data.map(z=>z[1]),1);let y=105;data.forEach((z,i)=>{const bw=520*z[1]/max;x.fillStyle=['#1976d2','#4d78a8','#6f8fab','#8fa9c0'][i%4];x.fillRect(300,y,bw,24);x.fillStyle='#536b83';x.font='600 16px Arial';let lab=z[0];if(lab.length>31)lab=lab.slice(0,29)+'…';x.textAlign='right';x.fillText(lab,286,y+18);x.textAlign='left';x.fillStyle='#17365d';x.font='800 16px Arial';x.fillText(fmt(z[1]),310+bw,y+18);y+=49});x.textAlign='left';return c}
'''
          s=s[:start]+helper+r'''async function report(){b.disabled=true;b.innerHTML='⏳ <span>Preparing Report…</span>';msg('Reading current dashboard data…');try{await lib();await loadLogo();const [ca,tr]=await Promise.all([json('./capa-data.json'),json('./training-data.json')]);const C=Array.isArray(ca)?ca:(ca.records||[]),T0=Array.isArray(tr)?tr:(tr.records||[]);const T=T0.filter(r=>key(r,['Training Date','تاريخ التدريب | Training Date','trainingDate']));const risk=group(C,['risk','Risk Severity','Risk']),stat=group(C,['status','Status']),sites=group(C,['site','Site Name','siteName']),haz=group(C,['hazard','Hazards Types','Hazard Type']),types=group(T,['نوع التدريب | Training Type','Training Type','trainingType']),deps=group(T,['الإدارة / القسم | Department','Department','department']);const pick=(a,k)=>(a.find(x=>String(x[0]).toLowerCase()===k.toLowerCase())||['',0])[1],critical=pick(risk,'Critical'),high=pick(risk,'High'),medium=pick(risk,'Medium'),low=pick(risk,'Low'),open=pick(stat,'Open'),progress=pick(stat,'In Progress'),closed=pick(stat,'Closed');const hours=T.reduce((s,r)=>s+num(key(r,['مدة التدريب | Duration (Hours)','Duration (Hours)','مدة التدريب','Duration','duration'])),0),employees=new Set(T.map(r=>key(r,['اسم الموظف | Employee Name','Employee Name','employeeName'])).filter(Boolean)).size,departments=new Set(T.map(r=>key(r,['الإدارة / القسم | Department','Department','department'])).filter(Boolean)).size,programs=new Set(T.map(r=>key(r,['البرامج التدريبي | Training Program','Training Program','program'])).filter(Boolean)).size,providers=new Set(T.map(r=>key(r,['جهة التدريب | Training Provider','Training Provider','provider'])).filter(Boolean)).size;const mon=months(T),t=time(),{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',compress:true});let p=1,y=page(doc,p,t,'Executive HSE Snapshot','CAPA + Training | Live dashboard source data at report generation time');y=kpis(doc,[['Total CAPA',C.length],['Critical',critical],['High',high],['Open CAPA',open],['In Progress',progress],['Closed CAPA',closed],['Training Sessions',T.length],['Training Hours',hours],['Employees Trained',employees],['Departments',departments],['Programs',programs],['Providers',providers]],y+4);let rd=donut([['Critical',critical,'#e5252a'],['High',high,'#d97722'],['Medium',medium,'#c5a328'],['Low',low,'#62a36d']],'CAPA Risk Severity'),sd=donut([['Open',open,'#315d91'],['In Progress',progress,'#d97722'],['Closed',closed,'#23834b']],'CAPA Status');addImg(doc,rd,y+3,70);addImg(doc,sd,y+3,70);y+=72;doc.setFillColor(247,250,253);doc.roundedRect(14,y,182,28,4,4,'F');doc.setTextColor(23,54,93);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Executive Highlights',20,y+8);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.text(fmt(closed)+' closed CAPA | '+Math.round(closed/Math.max(C.length,1)*100)+'% closure rate',20,y+16);doc.text(fmt(critical+high)+' High/Critical CAPA | '+Math.round((critical+high)/Math.max(C.length,1)*100)+'% of total',20,y+22);
p++;y=page(doc,p,t,'CAPA Performance & Risk Analysis','Risk, status, sites and hazard concentration');addImg(doc,bars(['Critical','High','Medium','Low'],[critical,high,medium,low],'CAPA Risk Profile'),y,62);addImg(doc,bars(['Open','In Progress','Closed'],[open,progress,closed],'CAPA Status'),y+66,62);addImg(doc,hbars(sites.slice(0,8).map(z=>z[0]),sites.slice(0,8).map(z=>z[1]),'Top CAPA Sites'),y+132,72);addImg(doc,hbars(haz.slice(0,8).map(z=>z[0]),haz.slice(0,8).map(z=>z[1]),'Leading Hazard Categories'),y+132,72);
p++;y=page(doc,p,t,'Training Performance & Coverage','Valid training-date records only | Live Training source');y=kpis(doc,[['Training Sessions',T.length],['Training Hours',hours],['Employees',employees],['Departments',departments],['Programs',programs],['Providers',providers]],y+4);addImg(doc,bars(mon.map(z=>z[0]),mon.map(z=>z[1]),'Training Sessions by Month'),y+3,68);addImg(doc,bars(types.slice(0,6).map(z=>z[0]),types.slice(0,6).map(z=>z[1]),'Training Type'),y+72,68);addImg(doc,hbars(deps.slice(0,8).map(z=>z[0]),deps.slice(0,8).map(z=>z[1]),'Top Training Departments'),y+144,70);
p++;y=page(doc,p,t,'Management Analysis & HSE Expansion','Executive focus and future-ready reporting structure');const closure=Math.round(closed/Math.max(C.length,1)*100),hc=critical+high;doc.setFillColor(255,245,245);doc.roundedRect(14,y,58,30,4,4,'F');doc.setFillColor(255,243,232);doc.roundedRect(76,y,58,30,4,4,'F');doc.setFillColor(235,244,252);doc.roundedRect(138,y,58,30,4,4,'F');doc.setTextColor(23,54,93);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('Risk Attention',19,y+9);doc.setFontSize(16);doc.text(fmt(hc),19,y+23);doc.setFontSize(8);doc.text('Closure Rate',81,y+9);doc.setFontSize(16);doc.text(closure+'%',81,y+23);doc.setFontSize(8);doc.text('Training Hours',143,y+9);doc.setFontSize(16);doc.text(fmt(hours),143,y+23);y+=38;doc.setFillColor(8,43,82);doc.roundedRect(14,y,182,9,3,3,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('MANAGEMENT ATTENTION REGISTER',19,y+6);y+=13;const rows=[['High / Critical CAPA',fmt(hc)+' records','Priority risk reduction'],['Open CAPA',fmt(open)+' records','Active corrective-action workload'],['Top CAPA Site',sites[0]?sites[0][0]+' — '+fmt(sites[0][1]):'N/A','Highest record concentration'],['Top Training Department',deps[0]?deps[0][0]+' — '+fmt(deps[0][1]):'N/A','Largest training concentration'],['Training Peak',mon.length?mon.reduce((a,z)=>z[1]>a[1]?z:a,mon)[0]:'N/A',mon.length?fmt(Math.max(...mon.map(z=>z[1])))+' sessions':'N/A']];rows.forEach((r,i)=>{doc.setFillColor(i%2?248:244,i%2?250:247,i%2?252:250);doc.rect(14,y,182,16,'F');doc.setTextColor(23,54,93);doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text(r[0],19,y+7);doc.setFont('helvetica','normal');doc.setTextColor(83,104,126);doc.text(r[1],82,y+7);doc.setFontSize(6.5);doc.text(r[2],82,y+12);y+=17});y+=5;doc.setFillColor(247,250,253);doc.roundedRect(14,y,182,34,4,4,'F');doc.setTextColor(23,54,93);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('FUTURE HSE MODULES',19,y+9);doc.setFont('helvetica','normal');doc.setTextColor(83,104,126);doc.setFontSize(7);doc.text('Safety Observations • Incidents • Near Miss • Inspections',19,y+17);doc.text('Fire Safety • First Aid • Analytics • Reports',19,y+24);doc.text('Each module will be added automatically when its real live dataset is available.',19,y+31);doc.save('Alfa_Labs_HSE_Management_Report_'+t.replace(/[^0-9]/g,'')+'.pdf');msg('Report downloaded successfully.')}catch(e){console.error(e);msg('Report generation failed');alert('Report generation failed: '+(e.message||e))}finally{b.disabled=false;b.innerHTML='📄 <span>Get a Report</span>'}}
''' + s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hse-report-generator.js
          git commit -m 'Upgrade live HSE report formatting' || true
          git push
