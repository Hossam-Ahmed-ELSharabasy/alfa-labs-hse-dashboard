name: Upgrade Executive Home
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build executive dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''/* EXECUTIVE HOME V3 */
          .mobile-header-logo{display:none}
          .insight-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}
          .training-trend{min-height:330px}.trend-chart{height:255px;display:flex;align-items:flex-end;gap:10px;padding:15px 6px 0;border-bottom:1px solid #e8edf2;overflow:hidden}.trend-col{height:100%;flex:1;min-width:28px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.trend-value{font-size:10px;font-weight:800;color:#536b83;margin-bottom:5px}.trend-bar{width:70%;max-width:42px;background:#1976d2;border-radius:6px 6px 0 0;min-height:5px}.trend-label{font-size:9px;color:#71808e;margin-top:7px;white-space:nowrap}
          .mini-list{display:flex;flex-direction:column;gap:12px;padding-top:4px}.mix-row{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center}.mix-label{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mix-track{grid-column:1/-1;height:7px;background:#edf2f7;border-radius:8px;overflow:hidden}.mix-fill{height:100%;background:#315d91;border-radius:8px}.mix-count{text-align:right;font-size:12px;font-weight:900;color:#536b83}
          .snapshot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.snapshot{background:#fff;border:1px solid #e7ecf1;border-radius:12px;padding:14px;display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text);transition:.18s}.snapshot:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(25,55,85,.06)}.snapshot-icon{width:38px;height:38px;border-radius:10px;background:#eef5fc;display:grid;place-items:center;font-size:18px;flex:0 0 auto}.snapshot b{display:block;font-size:19px}.snapshot small{display:block;font-size:10px;color:#7c8b99;margin-top:3px}.snapshot-arrow{margin-left:auto;font-weight:900;color:#1976d2}
          .executive-banner{background:linear-gradient(135deg,#0b3157,#145b9b);color:#fff;border-radius:15px;padding:20px 22px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 8px 24px rgba(7,26,51,.12)}.executive-banner h2{font-size:22px;margin:0 0 6px}.executive-banner p{margin:0;color:#dbe9f8;font-size:12px}.executive-banner .ebadge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:9px 12px;border-radius:10px;font-size:11px;white-space:nowrap}
          @media(max-width:1250px){.insight-grid{grid-template-columns:1fr}.snapshot-grid{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:700px){.mobile-header-logo{display:block!important;width:46px!important;height:40px!important;object-fit:contain!important;background:#fff;border-radius:7px;padding:3px;flex:0 0 46px;box-shadow:0 2px 7px rgba(0,0,0,.12)}.unified-left{display:flex;align-items:center;gap:8px;min-width:0}.executive-banner{padding:16px;border-radius:12px}.executive-banner h2{font-size:18px}.executive-banner p{font-size:10px;line-height:1.5}.executive-banner .ebadge{font-size:9px;padding:7px 8px}.insight-grid{grid-template-columns:1fr;gap:12px}.snapshot-grid{grid-template-columns:1fr 1fr;gap:9px}.snapshot{padding:11px;gap:8px}.snapshot b{font-size:16px}.snapshot small{font-size:9px}.snapshot-icon{width:33px;height:33px;font-size:16px}.trend-chart{height:220px;gap:5px}.trend-label{font-size:8px}.mix-label{font-size:11px}.footer{margin-top:18px;min-height:0;padding:14px 12px;gap:7px}.footer-brand{font-size:18px}.footer-copy{font-size:10px;line-height:1.55}.footer-copy small{font-size:9px}.footer-tag{font-size:10px}}
          @media(max-width:390px){.mobile-header-logo{width:42px!important;flex-basis:42px}.snapshot-grid{grid-template-columns:1fr}.unified-title h1,.unified-title h2{font-size:15px}.unified-title p{font-size:9px}}
          '''
          if '/* EXECUTIVE HOME V3 */' not in s: s=s.replace('</style>',css+'</style>',1)
          if 'class="mobile-header-logo"' not in s:
              s=s.replace('<div class="unified-title">','<img class="mobile-header-logo" src="./LOGOG.png" alt="Alfa Labs"><div class="unified-title">',1)
          # Replace dashboard body content while preserving the master header/footer shell.
          new_body=r'''<section class="content">
            <div class="executive-banner"><div><h2>Executive HSE Overview</h2><p>One clear view of CAPA performance and Training activity.</p></div><div class="ebadge">LIVE DATA • ALFA LABS</div></div>
            <div class="welcome"><div><h2>HSE Performance 👋</h2><p>Key indicators and management actions at a glance</p></div><div class="data-status"><span class="status-dot"></span><span id="dataStatus">Connecting to live data…</span></div></div>
            <div class="load-error" id="loadError">تعذر تحميل بيانات المنصة. تأكد من وجود <b>capa-data.json</b> و <b>training-data.json</b>.</div>
            <div class="section-label">HSE PERFORMANCE — LIVE</div>
            <div class="kpis">
              <a class="kpi" href="capa.html" style="text-decoration:none;color:inherit"><div class="kpi-top"><span class="kpi-label">Total CAPA</span><span class="kpi-icon">📋</span></div><div class="kpi-value" id="totalValue">—</div><div class="kpi-sub">All CAPA records</div><div class="kpi-link">View CAPA →</div></a>
              <a class="kpi open" href="capa.html?status=Open" style="text-decoration:none;color:inherit"><div class="kpi-top"><span class="kpi-label">Open CAPA</span><span class="kpi-icon">⚠️</span></div><div class="kpi-value" id="openValue">—</div><div class="kpi-sub">Require corrective action</div><div class="kpi-link">Filter Open →</div></a>
              <a class="kpi high" href="capa.html?risk=High" style="text-decoration:none;color:inherit"><div class="kpi-top"><span class="kpi-label">High Risk</span><span class="kpi-icon">🟠</span></div><div class="kpi-value" id="highValue">—</div><div class="kpi-sub">Priority CAPA</div><div class="kpi-link">Filter High →</div></a>
              <a class="kpi critical" href="capa.html?risk=Critical" style="text-decoration:none;color:inherit"><div class="kpi-top"><span class="kpi-label">Critical</span><span class="kpi-icon">🔴</span></div><div class="kpi-value" id="criticalValue">—</div><div class="kpi-sub">Management attention</div><div class="kpi-link">Filter Critical →</div></a>
              <a class="kpi progress" href="training.html" style="text-decoration:none;color:inherit"><div class="kpi-top"><span class="kpi-label">Training Sessions</span><span class="kpi-icon">🎓</span></div><div class="kpi-value" id="trainingValue">—</div><div class="kpi-sub">Actual dated records</div><div class="kpi-link">View Training →</div></a>
              <a class="kpi closed" href="training.html" style="text-decoration:none;color:inherit"><div class="kpi-top"><span class="kpi-label">Training Hours</span><span class="kpi-icon">⏱️</span></div><div class="kpi-value" id="trainingHours">—</div><div class="kpi-sub">Recorded training hours</div><div class="kpi-link">Training analytics →</div></a>
            </div>
            <div class="insight-grid">
              <div class="card"><div class="card-title"><h3>CAPA Risk Profile</h3><span>Current distribution</span></div><div class="bar-chart" id="riskChart"></div></div>
              <div class="card"><div class="card-title"><h3>CAPA Status</h3><span id="statusRate">Live</span></div><div class="status-area"><div class="donut" id="statusDonut"><div class="donut-inner"><strong id="donutTotal">—</strong><small>Total CAPA</small></div></div><div class="legend"><div class="legend-item"><span class="legend-name"><span class="dot dot-open"></span>Open</span><span class="legend-count" id="legendOpen">—</span></div><div class="legend-item"><span class="legend-name"><span class="dot dot-progress"></span>In Progress</span><span class="legend-count" id="legendProgress">—</span></div><div class="legend-item"><span class="legend-name"><span class="dot dot-closed"></span>Closed</span><span class="legend-count" id="legendClosed">—</span></div></div></div></div>
              <div class="card training-trend"><div class="card-title"><h3>Training Trend</h3><span>Sessions by month</span></div><div class="trend-chart" id="trainingTrend"></div></div>
              <div class="card"><div class="card-title"><h3>Training Mix</h3><span>Top training types</span></div><div class="mini-list" id="trainingMix"></div></div>
            </div>
            <div class="card action-card"><div class="card-title"><h3>⚡ Action Required</h3><span>Priority management view</span></div><div class="actions"><a class="action critical" href="capa.html?risk=Critical"><span class="action-icon">🔴</span><span><strong>Critical CAPA</strong><span>Immediate management attention</span></span><b class="action-count" id="actionCritical">—</b></a><a class="action high" href="capa.html?risk=High"><span class="action-icon">🟠</span><span><strong>High-Risk CAPA</strong><span>Priority corrective action</span></span><b class="action-count" id="actionHigh">—</b></a><a class="action" href="capa.html?status=Open"><span class="action-icon">⚠️</span><span><strong>Open CAPA</strong><span>Still requiring closure</span></span><b class="action-count" id="actionOpen">—</b></a></div></div>
            <div class="snapshot-grid"><a class="snapshot" href="training.html"><span class="snapshot-icon">👥</span><span><b id="trainingEmployees">—</b><small>Employees trained</small></span><span class="snapshot-arrow">→</span></a><a class="snapshot" href="training.html"><span class="snapshot-icon">🏢</span><span><b id="trainingDepartments">—</b><small>Departments covered</small></span><span class="snapshot-arrow">→</span></a><a class="snapshot" href="training.html"><span class="snapshot-icon">📚</span><span><b id="trainingPrograms">—</b><small>Training programs</small></span><span class="snapshot-arrow">→</span></a><a class="snapshot" href="training.html"><span class="snapshot-icon">🏷️</span><span><b id="trainingProviders">—</b><small>Training providers</small></span><span class="snapshot-arrow">→</span></a></div>
            <div class="quick"><a href="capa.html">📋 View CAPA</a><a href="training.html">🎓 View Training</a><a href="capa.html#add">➕ Add CAPA</a><a href="#">📊 Analytics</a></div>
            <footer class="footer"><div class="footer-brand">Alfa Labs</div><div class="footer-copy">جميع الحقوق محفوظة لـ الفا لاب<br>إدارة البيئة والسلامة والصحة المهنية<br><small>Created by Hossam Elsharabasy — HSE Manager</small></div><div class="footer-tag">Safer Today ... A Healthier Tomorrow</div></footer>
          </section>'''
          s=re.sub(r'<section class="content">.*?<footer class="footer">.*?</footer>\s*</section>',new_body,s,count=1,flags=re.S)
          js=r'''<script>
          (function(){const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('sidebarOverlay'),button=document.getElementById('mobileMenuBtn');function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show');button.setAttribute('aria-expanded','false');document.body.style.overflow=''}function openMenu(){sidebar.classList.add('open');overlay.classList.add('show');button.setAttribute('aria-expanded','true');document.body.style.overflow='hidden'}button.addEventListener('click',()=>sidebar.classList.contains('open')?closeMenu():openMenu());overlay.addEventListener('click',closeMenu);sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{if(innerWidth<=700)closeMenu()}));addEventListener('resize',()=>{if(innerWidth>700)closeMenu()})})();
          function clean(v){return String(v??'').trim()} function parseDate(v){const s=clean(v);if(!s)return null;let d=new Date(s);if(!isNaN(d))return d;const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null} function countBy(a,k){const m={};a.forEach(r=>{const x=clean(r[k]);if(x)m[x]=(m[x]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])} function fmt(n){return Number(n||0).toLocaleString('en-US')}
          function drawBars(items){const el=document.getElementById('riskChart'),max=Math.max(...items.map(x=>x[1]),1);el.innerHTML=items.map(([l,v])=>`<div class="bar-wrap"><div class="bar-value">${fmt(v)}</div><div class="bar ${l.toLowerCase()}" style="height:${Math.max(8,v/max*185)}px"></div><div class="bar-label">${l}</div></div>`).join('')}
          function drawTrend(a){const el=document.getElementById('trainingTrend'),months=['Apr','May','Jun','Jul','Aug','Sep'],vals=months.map((m,i)=>[m,a.filter(r=>{const d=parseDate(r['تاريخ التدريب | Training Date']);return d&&d.getMonth()===i+3}).length]),max=Math.max(...vals.map(x=>x[1]),1);el.innerHTML=vals.map(([m,v])=>`<div class="trend-col"><div class="trend-value">${fmt(v)}</div><div class="trend-bar" style="height:${Math.max(5,v/max*190)}px"></div><div class="trend-label">${m}</div></div>`).join('')}
          function drawMix(a){const items=countBy(a,'نوع التدريب Training Type').slice(0,5),el=document.getElementById('trainingMix'),max=Math.max(...items.map(x=>x[1]),1);el.innerHTML=items.map(([l,v])=>`<div class="mix-row"><div class="mix-label" title="${l}">${l}</div><div class="mix-count">${fmt(v)}</div><div class="mix-track"><div class="mix-fill" style="width:${v/max*100}%"></div></div></div>`).join('')}
          async function load(){try{const [cr,tr]=await Promise.all([fetch('capa-data.json',{cache:'no-store'}),fetch('training-data.json',{cache:'no-store'})]);if(!cr.ok||!tr.ok)throw Error('data');const capa=await cr.json(),raw=await tr.json(),training=raw.filter(r=>parseDate(r['تاريخ التدريب | Training Date']));const risk=Object.fromEntries(countBy(capa,'Risk Severity')),st=Object.fromEntries(countBy(capa,'Status')),total=capa.length,open=st['Open']||0,prog=st['In Progress']||0,closed=st['Closed']||0;document.getElementById('totalValue').textContent=fmt(total);document.getElementById('openValue').textContent=fmt(open);document.getElementById('highValue').textContent=fmt(risk['High']||0);document.getElementById('criticalValue').textContent=fmt(risk['Critical']||0);document.getElementById('trainingValue').textContent=fmt(training.length);let hours=0;training.forEach(r=>{const x=parseFloat(clean(r['مدة التدريب | Duration (Hours)']).replace(',','.'));if(!isNaN(x))hours+=x});document.getElementById('trainingHours').textContent=fmt(Math.round(hours*10)/10);document.getElementById('legendOpen').textContent=fmt(open);document.getElementById('legendProgress').textContent=fmt(prog);document.getElementById('legendClosed').textContent=fmt(closed);document.getElementById('donutTotal').textContent=fmt(total);document.getElementById('actionCritical').textContent=fmt(risk['Critical']||0);document.getElementById('actionHigh').textContent=fmt(risk['High']||0);document.getElementById('actionOpen').textContent=fmt(open);document.getElementById('statusRate').textContent=total?Math.round(closed/total*100)+'% closed':'—';const p1=total?open/total*100:0,p2=total?(open+prog)/total*100:0;document.getElementById('statusDonut').style.background=`conic-gradient(#315d91 0 ${p1}%,#d97722 ${p1}% ${p2}%,#23834b ${p2}% 100%)`;drawBars([['Critical',risk['Critical']||0],['High',risk['High']||0],['Medium',risk['Medium']||0],['Low',risk['Low']||0]]);drawTrend(training);drawMix(training);document.getElementById('trainingEmployees').textContent=fmt(new Set(training.map(r=>clean(r['اسم الموظف | Employee Name'])).filter(Boolean)).size);document.getElementById('trainingDepartments').textContent=fmt(new Set(training.map(r=>clean(r['الإدارة / القسم | Department'])).filter(Boolean)).size);document.getElementById('trainingPrograms').textContent=fmt(new Set(training.map(r=>clean(r['البرامج التدريبي | Training Program'])).filter(Boolean)).size);document.getElementById('trainingProviders').textContent=fmt(new Set(training.map(r=>clean(r['جهة التدريب | Training Provider'])).filter(Boolean)).size);document.getElementById('dataStatus').textContent=`Live data connected • CAPA ${fmt(total)} • Training ${fmt(training.length)}`}catch(e){console.error(e);document.getElementById('loadError').classList.add('show');document.getElementById('dataStatus').textContent='Data unavailable'}}
          function clock(){const d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],h=d.getHours()%12||12,a=d.getHours()>=12?'PM':'AM';document.getElementById('liveClock').textContent=`Today • ${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()} • ${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} ${a}`} clock();setInterval(clock,1000);load();
          </script>'''
          s=re.sub(r'<script>.*?</script>\s*</body>',js+'\n</body>',s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit home upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade home dashboard with CAPA and Training insights"
          git push
