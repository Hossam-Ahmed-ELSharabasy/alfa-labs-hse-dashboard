name: Hard remove dashboard circles
on:
  push:
    paths:
      - '.github/workflows/hard-remove-dashboard-circles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove decorative circles from dashboard cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n<style id="hard-remove-dashboard-circles">\n/* FINAL HARD FIX */\n.insight-grid .card:before,.insight-grid .card:after,.card-title:before,.card-title:after{content:none!important;display:none!important;background:none!important;box-shadow:none!important;border:0!important;opacity:0!important;width:0!important;height:0!important;}\n</style>\n'''
          if 'hard-remove-dashboard-circles' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Hard remove dashboard decorative circles'
          git push
