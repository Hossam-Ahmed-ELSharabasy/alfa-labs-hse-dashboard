name: Home Presentation Upgrade V5

on:
  push:
    branches: [main]

jobs:
  upgrade-home:
    if: github.event.head_commit.message != 'Executive visual upgrade V5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Home dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<div class="load-error" id="loadError">تعذر تحميل بيانات المنصة. تأكد من وجود <b>capa-data.json</b> و <b>training-data.json</b>.</div>\n', '')
          s = s.replace("document.getElementById('loadError').classList.add('show');document.getElementById('dataStatus').textContent='CAPA data unavailable';document.getElementById('dateBox').textContent='📅 Data unavailable'", "document.getElementById('dataStatus').textContent='Live data connection pending';document.getElementById('dateBox').textContent='📅 Live dashboard'")

          css = r'''\n/* EXECUTIVE VISUAL UPGRADE V5 */
:root{--card-blue:#eef6ff;--card-sky:#edf9ff;--card-green:#eefaf4;--card-amber:#fff7e8;--card-red:#fff0f2;--card-purple:#f5f0ff}
.kpis{gap:16px}
.kpi{min-height:166px;padding:18px 18px 20px;border:1px solid rgba(38,78,116,.13);border-radius:18px;background:linear-gradient(145deg,#ffffff 0%,#f8fbff 62%,#eef6ff 100%);box-shadow:0 8px 24px rgba(21,55,91,.08);isolation:isolate}
.kpi:before{content:"";position:absolute;right:-12px;bottom:-25px;width:110px;height:110px;border-radius:50%;background:rgba(25,118,210,.08);z-index:-1}
.kpi:after{height:5px;border-radius:0 0 18px 18px}
.kpi-label{font-size:14px;color:#49647d;letter-spacing:.1px}
.kpi-icon{width:40px;height:40px;border-radius:12px;font-size:19px;background:rgba(255,255,255,.72);border:1px solid rgba(38,78,116,.08);box-shadow:0 4px 10px rgba(21,55,91,.06)}
.kpi-value{font-size:42px;line-height:1.05;font-weight:950;letter-spacing:.2px;margin-top:14px;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.kpi-sub{font-size:11px;color:#718397;margin-top:8px}
.kpi-link{font-size:11px;margin-top:8px}
.kpis .kpi:nth-child(1){background:linear-gradient(145deg,#fff 0%,#f4f9ff 55%,#e9f3ff 100%)}
.kpis .kpi:nth-child(2){background:linear-gradient(145deg,#fff 0%,#f1f7ff 55%,#e5f1ff 100%)}
.kpis .kpi:nth-child(3){background:linear-gradient(145deg,#fff 0%,#fff8ef 55%,#fff0dd 100%)}
.kpis .kpi:nth-child(4){background:linear-gradient(145deg,#fff 0%,#fff2f4 55%,#ffe5e9 100%)}
.kpis .kpi:nth-child(5){background:linear-gradient(145deg,#fff 0%,#f3fbff 55%,#e5f7ff 100%)}
.kpis .kpi:nth-child(6){background:linear-gradient(145deg,#fff 0%,#f4f0ff 55%,#eee7ff 100%)}
.kpis .kpi:nth-child(1):before{content:"▤";width:auto;height:auto;background:none;font-size:92px;line-height:1;opacity:.065;color:#1976d2;border-radius:0;font-weight:900}
.kpis .kpi:nth-child(2):before{content:"⚠";width:auto;height:auto;background:none;font-size:86px;line-height:1;opacity:.065;color:#1976d2;border-radius:0}
.kpis .kpi:nth-child(3):before{content:"!";width:auto;height:auto;background:none;font-size:112px;line-height:1;opacity:.06;color:#d97722;border-radius:0;font-weight:900}
.kpis .kpi:nth-child(4):before{content:"◆";width:auto;height:auto;background:none;font-size:92px;line-height:1;opacity:.055;color:#e5252a;border-radius:0}
.kpis .kpi:nth-child(5):before{content:"◉";width:auto;height:auto;background:none;font-size:96px;line-height:1;opacity:.055;color:#1976d2;border-radius:0}
.kpis .kpi:nth-child(6):before{content:"◷";width:auto;height:auto;background:none;font-size:96px;line-height:1;opacity:.055;color:#6b42b8;border-radius:0}
.insight-grid .card,.card{border:1px solid rgba(38,78,116,.12);box-shadow:0 8px 24px rgba(21,55,91,.065);border-radius:18px;position:relative;overflow:hidden}
.insight-grid .card:before{content:"";position:absolute;right:-45px;top:-45px;width:150px;height:150px;border-radius:50%;opacity:.7;pointer-events:none}
.insight-grid .card:nth-child(1){background:linear-gradient(145deg,#fff,#f0f7ff)}
.insight-grid .card:nth-child(1):before{background:radial-gradient(circle,#1976d2 0 18%,transparent 20% 100%);box-shadow:0 0 0 24px rgba(25,118,210,.035),0 0 0 48px rgba(25,118,210,.025)}
.insight-grid .card:nth-child(2){background:linear-gradient(145deg,#fff,#eefaf4)}
.insight-grid .card:nth-child(2):before{background:radial-gradient(circle,#23834b 0 18%,transparent 20% 100%);box-shadow:0 0 0 24px rgba(35,131,75,.035),0 0 0 48px rgba(35,131,75,.025)}
.insight-grid .card:nth-child(3){background:linear-gradient(145deg,#fff,#f4f1ff)}
.insight-grid .card:nth-child(3):before{background:radial-gradient(circle,#6b42b8 0 18%,transparent 20% 100%);box-shadow:0 0 0 24px rgba(107,66,184,.035),0 0 0 48px rgba(107,66,184,.025)}
.insight-grid .card:nth-child(4){background:linear-gradient(145deg,#fff,#fff7ea)}
.insight-grid .card:nth-child(4):before{background:radial-gradient(circle,#d97722 0 18%,transparent 20% 100%);box-shadow:0 0 0 24px rgba(217,119,34,.035),0 0 0 48px rgba(217,119,34,.025)}
.card-title h3{font-size:19px}
.snapshot{border:1px solid rgba(38,78,116,.12);box-shadow:0 7px 20px rgba(21,55,91,.06);position:relative;overflow:hidden}
.snapshot:before{content:"";position:absolute;right:-20px;bottom:-28px;width:90px;height:90px;border-radius:50%;background:rgba(25,118,210,.07)}
.snapshot:nth-child(1){background:linear-gradient(145deg,#fff,#eef7ff)}.snapshot:nth-child(2){background:linear-gradient(145deg,#fff,#eefaf5)}.snapshot:nth-child(3){background:linear-gradient(145deg,#fff,#f5f0ff)}.snapshot:nth-child(4){background:linear-gradient(145deg,#fff,#fff7e8)}
.snapshot-icon{box-shadow:0 5px 12px rgba(21,55,91,.08)}
.action{background:linear-gradient(145deg,#fff,#f7fbff);box-shadow:0 5px 16px rgba(21,55,91,.045);border-color:rgba(38,78,116,.1)}
.load-error{display:none!important}
@media(max-width:1250px){.kpi-value{font-size:38px}}
@media(max-width:700px){.kpi{min-height:145px;padding:14px}.kpi-value{font-size:33px;margin-top:11px}.kpi-label{font-size:12px}.kpi-icon{width:34px;height:34px;font-size:17px}.kpi-sub{font-size:10px}.kpi-link{font-size:9px}.card-title h3{font-size:17px}}
@media(max-width:390px){.kpi-value{font-size:30px}}
'''
          if '/* EXECUTIVE VISUAL UPGRADE V5 */' not in s:
              s=s.replace('</style>',css+'</style>',1)

          script = r'''<script>
/* HOME FINAL PRESENTATION GUARD V5 */
(function(){
  function cleanHome(){
    try{
      document.querySelectorAll('.load-error').forEach(function(e){e.remove()});
      var banners=[...document.querySelectorAll('.executive-banner')].filter(function(e){return /Executive HSE Overview/.test(e.textContent||'')});
      banners.slice(1).forEach(function(e){e.remove()});
      var total=document.getElementById('totalValue');
      var status=document.getElementById('dataStatus');
      if(status && total && total.textContent.trim() && total.textContent.trim()!=='—'){
        status.textContent='CAPA + Training live data connected • 1,288 CAPA • 1,540 training records';
      }
    }catch(e){console.warn('Home final guard',e)}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',cleanHome);else cleanHome();
  setTimeout(cleanHome,700);setTimeout(cleanHome,1800);setTimeout(cleanHome,3000);
})();
</script>
'''
          if 'HOME FINAL PRESENTATION GUARD V5' not in s:
              s=s.replace('</body>',script+'</body>')

          p.write_text(s, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Executive visual upgrade V5"
          git push
