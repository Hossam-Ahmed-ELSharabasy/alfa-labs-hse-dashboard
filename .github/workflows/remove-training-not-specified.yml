name: Remove blank training categories
on:
  push:
    paths:
      - 'training.html'
      - '.github/workflows/remove-training-not-specified.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Training charts
        shell: python
        run: |
          from pathlib import Path
          p=Path('training.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- REMOVE-NOT-SPECIFIED-TRAINING -->'
          if marker not in s:
              patch=r'''<!-- REMOVE-NOT-SPECIFIED-TRAINING -->
<script>
(function(){
  function strip(){
    try{
      if(typeof charts==='undefined') return;
      Object.keys(charts).forEach(function(k){
        var c=charts[k]; if(!c || !c.data || !Array.isArray(c.data.labels)) return;
        var labels=c.data.labels;
        var remove=[];
        labels.forEach(function(v,i){if(String(v).trim().toLowerCase()==='not specified') remove.push(i)});
        if(!remove.length) return;
        c.data.labels=labels.filter(function(_,i){return remove.indexOf(i)<0});
        (c.data.datasets||[]).forEach(function(ds){
          if(Array.isArray(ds.data)) ds.data=ds.data.filter(function(_,i){return remove.indexOf(i)<0});
        });
        c.update('none');
      });
    }catch(e){}
  }
  strip();
  setInterval(strip,500);
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Not Specified from Training charts"
          git push
