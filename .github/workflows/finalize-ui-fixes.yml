name: Finalize dashboard UI fixes
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'training.html'
      - '.github/workflows/finalize-ui-fixes.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compatibility fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'id="dateBox"' not in s:
              s=s.replace('<div class="live-clock" id="liveClock">','<span id="dateBox" style="display:none"></span><div class="live-clock" id="liveClock">',1)
              p.write_text(s,encoding='utf-8')
          p=Path('training.html'); s=p.read_text(encoding='utf-8')
          old='const countBy=(arr,key)=>{const m={};arr.forEach(r=>{const x=label(r[key]);m[x]=(m[x]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,20)};'
          new='const countBy=(arr,key)=>{const m={};arr.forEach(r=>{const x=clean(r[key]);if(!x)return;m[x]=(m[x]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,20)};'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html training.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Finalize header compatibility and chart labels"
          git push
