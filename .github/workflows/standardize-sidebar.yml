name: Standardize sidebar
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/standardize-sidebar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject master sidebar script
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','capa.html','training.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              tag='<script src="./sidebar-standard.js"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html capa.html training.html
          git commit -m 'Use master sidebar across HSE pages' || exit 0
          git push
