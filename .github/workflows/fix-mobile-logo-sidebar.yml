name: Fix mobile logo and CAPA sidebar
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CAPA mobile header and sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('capa.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* Mobile Alfa Labs logo in header */\n.mobile-header-logo{display:none}\n@media(max-width:800px){\n  .mobile-header-logo{display:block!important;width:52px!important;height:42px!important;object-fit:contain!important;background:#fff;border-radius:7px;padding:3px;flex:0 0 52px;box-shadow:0 2px 7px rgba(0,0,0,.12)}\n  .header{position:relative}\n}\n'''
          if '.mobile-header-logo{display:none}' not in s:
              s=s.replace('</style>',css+'</style>',1)
          if 'class="mobile-header-logo"' not in s:
              marker='<div class="header-title">'
              s=s.replace(marker,'<img class="mobile-header-logo" src="./LOGOG.png" alt="Alfa Labs">'+marker,1)
          # Ensure Training exists directly after CAPA in the master sidebar.
          if 'href="training.html"' not in s:
              anchor='href="capa.html"'
              pos=s.find(anchor)
              if pos!=-1:
                  astart=s.rfind('<a ',0,pos)
                  aend=s.find('</a>',pos)
                  aend=s.find('>',aend)+1 if aend!=-1 else -1
                  if astart!=-1 and aend!=-1:
                      capa_link=s[astart:aend]
                      icon='🎓'
                      training='<a href="training.html"><span class="icon">'+icon+'</span><span>Training</span></a>'
                      s=s[:aend]+training+s[aend:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capa.html
          git diff --cached --quiet || git commit -m "Fix CAPA mobile logo and Training sidebar"
          git push
