name: Fix CAPA mobile logo
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix CAPA mobile logo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CAPA mobile header logo
        shell: python
        run: |
          from pathlib import Path
          p=Path('capa.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* CAPA MOBILE HEADER LOGO FINAL */\n.capa-mobile-logo{display:none;width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;box-shadow:0 2px 7px rgba(8,43,82,.15);flex:0 0 42px}\n@media(max-width:800px){.capa-mobile-logo{display:block!important}.header{display:flex!important;align-items:center!important;gap:10px!important}.header-title{min-width:0!important;flex:1!important}.header-title h2,.header-title p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}\n'''
          if '/* CAPA MOBILE HEADER LOGO FINAL */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          script='''\n<script>\n(function(){\n  function addCapaMobileLogo(){\n    var h=document.querySelector('.header');\n    if(!h || h.querySelector('.capa-mobile-logo')) return;\n    var img=document.createElement('img');\n    img.className='capa-mobile-logo';\n    img.src='./LOGOG.png';\n    img.alt='Alfa Labs Logo';\n    img.setAttribute('aria-label','Alfa Labs Logo');\n    h.insertBefore(img,h.firstChild);\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addCapaMobileLogo); else addCapaMobileLogo();\n  setTimeout(addCapaMobileLogo,300);\n  setTimeout(addCapaMobileLogo,1000);\n})();\n</script>\n'''
          if 'capa-mobile-logo' not in s:
              s=s.replace('</body>',script+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capa.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix CAPA mobile logo"
          git push
