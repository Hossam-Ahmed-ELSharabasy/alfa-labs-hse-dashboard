name: Standardize all HSE footers
on:
  push:
    paths:
      - '.github/workflows/unify-all-footers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify and enlarge footers
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ['index.html','capa.html','training.html']
          css = '''\n<style id="unified-footer-final">\n.footer{margin-top:24px!important;background:#082b52!important;color:#fff!important;padding:22px 28px!important;min-height:118px!important;height:auto!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:26px!important;flex-wrap:wrap!important;border-top:1px solid rgba(255,255,255,.12)!important;text-align:center!important}\n.footer-brand{font-size:18px!important;font-weight:800!important;line-height:1.45!important}.footer-copy{font-size:14px!important;font-weight:700!important;line-height:1.65!important;text-align:center!important}.footer-copy small{font-size:12px!important;font-weight:600!important;opacity:.88!important}.footer-en{font-size:12px!important;font-weight:600!important;opacity:.88!important}.footer-tag{font-size:14px!important;font-weight:700!important;line-height:1.5!important;white-space:nowrap!important;opacity:.95!important}\n.footer .ar,.footer .eng,.footer .tag{font-size:14px!important;line-height:1.65!important}\n@media(max-width:700px){.footer{margin-top:18px!important;padding:18px 12px!important;min-height:145px!important;flex-direction:column!important;gap:7px!important;text-align:center!important}.footer-brand{font-size:17px!important}.footer-copy,.footer .ar,.footer .eng,.footer .tag{font-size:13px!important;line-height:1.55!important}.footer-copy small,.footer-en{font-size:11px!important}.footer-tag{font-size:13px!important;white-space:normal!important;max-width:100%!important}}\n@media(max-width:390px){.footer{padding:16px 9px!important;min-height:135px!important;gap:5px!important}.footer-brand{font-size:16px!important}.footer-copy,.footer .ar,.footer .eng,.footer .tag{font-size:12px!important}.footer-copy small,.footer-en{font-size:10px!important}.footer-tag{font-size:12px!important}}\n</style>\n<script id="unified-footer-content">\n(function(){function fix(){document.querySelectorAll('.footer').forEach(function(f){f.innerHTML='<div class="footer-brand">جميع الحقوق محفوظة لـ الفا لاب</div><div class="footer-copy">إدارة البيئة والسلامة والصحة المهنية<br><small>Created by Hossam Elsharabasy — HSE Manager</small></div><div class="footer-tag">🛡️ Safety First • Safety Is Everyone’s Responsibility</div>';});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix);else fix();setTimeout(fix,300);}());\n</script>\n'''
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'unified-footer-final' not in s:
                  s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html capa.html training.html
          git diff --cached --quiet || git commit -m 'Unify and enlarge all HSE footers'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/unify-all-footers.yml
          git commit -m 'Remove temporary footer workflow'
          git push
