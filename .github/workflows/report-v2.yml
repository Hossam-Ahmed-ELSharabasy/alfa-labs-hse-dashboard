name: Build Live HSE Report v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch report generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hse-report-generator.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const risk=group(C,['Risk Severity']),stat=group(C,['Status']),sites=group(C,['Site Name'])", "const risk=group(C,['risk','Risk Severity','Risk']),stat=group(C,['status','Status']),sites=group(C,['site','Site Name','siteName'])")
          s=s.replace("const types=group(T,['Training Type','نوع التدريب | Training Type']),deps=group(T,['Department','الإدارة / القسم | Department'])", "const types=group(T,['نوع التدريب | Training Type','Training Type','trainingType']),deps=group(T,['الإدارة / القسم | Department','Department','department'])")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hse-report-generator.js
          git commit -m 'Fix live report data mapping' || true
          git push
