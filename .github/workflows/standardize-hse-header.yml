name: Standardize HSE page headers
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'capa.html'
      - 'training.html'
      - '.github/workflows/standardize-hse-header.yml'
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified header
        shell: python
        run: |
          from pathlib import Path
          import re
          CSS = r'''/* UNIFIED HSE HEADER */
          .unified-header{min-height:82px;height:auto;background:#fff;border-bottom:1px solid #e3eaf1;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 28px;direction:ltr;position:sticky;top:0;z-index:30}
          .unified-left{display:flex;align-items:center;gap:13px;min-width:0}.unified-title{text-align:left;min-width:0}
          .unified-title h1,.unified-title h2{margin:0;font-size:25px;font-weight:800;color:#17365d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unified-title p{margin:5px 0 0;color:#71808e;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .unified-meta{display:flex;align-items:center;gap:14px;flex:0 0 auto;direction:ltr}.live-clock{background:#f5f7fa;border:1px solid #e3eaf1;border-radius:10px;padding:9px 12px;color:#17365d;font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.update-status{display:flex;align-items:center;gap:8px;color:#637689;font-size:12px;font-weight:700;white-space:nowrap}.update-dot{width:9px;height:9px;border-radius:50%;background:#23834b;box-shadow:0 0 0 4px #e4f4ea;animation:updatePulse 1.7s ease-in-out infinite}@keyframes updatePulse{0%,100%{opacity:1;box-shadow:0 0 0 4px #e4f4ea}50%{opacity:.35;box-shadow:0 0 0 7px rgba(35,131,75,.06)}}
          @media(max-width:700px){.unified-header{min-height:70px;padding:10px 14px;gap:8px}.unified-left{gap:9px}.unified-title h1,.unified-title h2{font-size:19px}.unified-title p{font-size:10px;margin-top:3px}.unified-meta{gap:6px;flex-direction:column;align-items:flex-end}.live-clock{font-size:10px;padding:6px 8px}.update-status{font-size:9px;gap:5px}.update-dot{width:7px;height:7px;box-shadow:0 0 0 3px #e4f4ea}}
          @media(max-width:430px){.unified-title h1,.unified-title h2{font-size:16px}.unified-title p{font-size:9px}.live-clock{font-size:9px;padding:5px 6px}.update-status{font-size:8px}.unified-meta{gap:4px}}
          '''
          HEADERS={
            'index.html':'''<header class="unified-header"><div class="unified-left"><button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="فتح القائمة" aria-expanded="false">☰</button><div class="unified-title"><h2>لوحة متابعة السلامة</h2><p>Alfa Labs HSE Management Platform</p></div></div><div class="unified-meta"><div class="live-clock" id="liveClock">Today • -- --- ---- • --:--:--</div><div class="update-status"><span class="update-dot"></span><span>Last updated today</span></div></div></header>''',
            'capa.html':'''<header class="unified-header"><div class="unified-left"><button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="فتح القائمة" aria-expanded="false">☰</button><div class="unified-title"><h2>CAPA Management</h2><p>Corrective and Preventive Action</p></div></div><div class="unified-meta"><div class="live-clock" id="liveClock">Today • -- --- ---- • --:--:--</div><div class="update-status"><span class="update-dot"></span><span>Last updated today</span></div></div></header>''',
            'training.html':'''<header class="unified-header"><div class="unified-left"><button class="menu" id="menu" type="button" aria-label="Open menu" aria-expanded="false">☰</button><div class="unified-title"><h1>Training Management</h1><p>Training Record &amp; HSE Training Analytics</p></div></div><div class="unified-meta"><div class="live-clock" id="liveClock">Today • -- --- ---- • --:--:--</div><div class="update-status"><span class="update-dot"></span><span>Last updated today</span></div></div></header>'''}
          def patch(path):
              p=Path(path); s=p.read_text(encoding='utf-8')
              s2=re.sub(r'<header\b[^>]*>.*?</header>',HEADERS[path],s,count=1,flags=re.I|re.S)
              if s2==s: raise SystemExit(f'Header not found in {path}')
              if '/* UNIFIED HSE HEADER */' not in s2: s2=s2.replace('</style>',CSS+'\n</style>',1)
              js='''<script>\n(function(){function pad(n){return String(n).padStart(2,'0')}function tick(){const el=document.getElementById('liveClock');if(!el)return;const d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],hh=d.getHours(),ap=hh>=12?'PM':'AM',h=hh%12||12;el.textContent='Today • '+pad(d.getDate())+' '+m[d.getMonth()]+' '+d.getFullYear()+' • '+pad(h)+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' '+ap}tick();setInterval(tick,1000)})();\n</script>'''
              if 'id="liveClock"' in s2 and 'function pad(n){return String(n).padStart(2' not in s2: s2=s2.replace('</body>',js+'\n</body>',1)
              p.write_text(s2,encoding='utf-8')
          for f in HEADERS: patch(f)
          print('Unified headers applied')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html capa.html training.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Standardize dashboard headers and live update status"
          git push
