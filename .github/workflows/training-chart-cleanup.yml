name: Training chart cleanup
on: [push]
permissions:
  contents: write
jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blank labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('training.html')
          s=p.read_text(encoding='utf-8')
          old='const label=v=>clean(v)||"Not Specified";'
          new='const label=v=>clean(v);'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.html
          git diff --cached --quiet || (git commit -m "Remove Not Specified from Training charts [skip ci]" && git push)
