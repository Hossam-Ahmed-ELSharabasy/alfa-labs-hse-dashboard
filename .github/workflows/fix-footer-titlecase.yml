name: Fix Safety Footer Title Case
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-footer-titlecase.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update footer slogan
        shell: python
        run: |
          from pathlib import Path
          files = [Path('index.html'), Path('capa.html'), Path('training.html')]
          old = 'SAFETY FIRST • SAFETY IS EVERYONE’S RESPONSIBILITY'
          new = '🛡️ Safety First • Safety Is Everyone’s Responsibility'
          for p in files:
              s = p.read_text(encoding='utf-8')
              if old in s:
                  s = s.replace(old, new)
              else:
                  # Handle any existing title-case variant without the shield.
                  s = s.replace('Safety First • Safety Is Everyone’s Responsibility', new)
              p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html capa.html training.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update safety footer slogan styling'
          git push
