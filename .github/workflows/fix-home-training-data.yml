name: Fix Home Training Data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Training summary loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* HOME TRAINING SUMMARY V1 */'
          if marker not in s:
              script='''<script>
          /* HOME TRAINING SUMMARY V1 */
          (async function(){
            try{
              const r=await fetch('./training-summary.json',{cache:'no-store'});
              if(!r.ok) throw new Error('Training summary HTTP '+r.status);
              const d=await r.json();
              const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=Number(v||0).toLocaleString('en-US')};
              set('trainingValue',d.records);set('trainingHours',d.trainingHours);set('trainingEmployees',d.employees);set('trainingDepartments',d.departments);set('trainingPrograms',d.programs);set('trainingProviders',d.providers);
              const trend=document.getElementById('trainingTrend');
              if(trend){const ms=['Apr','May','Jun','Jul','Aug','Sep'],vs=ms.map(m=>Number((d.monthly||{})[m]||0)),mx=Math.max(...vs,1);trend.innerHTML=ms.map((m,i)=>'<div class="trend-col"><div class="trend-value">'+vs[i].toLocaleString('en-US')+'</div><div class="trend-bar" style="height:'+Math.max(5,vs[i]/mx*190)+'px"></div><div class="trend-label">'+m+'</div></div>').join('')}
              const mix=document.getElementById('trainingMix');
              if(mix){const entries=Object.entries(d.trainingTypes||{}),mx=Math.max(...entries.map(x=>x[1]),1);mix.innerHTML=entries.map(x=>'<div class="mix-row"><div class="mix-label">'+x[0]+'</div><div class="mix-count">'+Number(x[1]).toLocaleString('en-US')+'</div><div class="mix-track"><div class="mix-fill" style="width:'+(x[1]/mx*100)+'%"></div></div></div>').join('')}
              const st=document.getElementById('dataStatus');if(st)st.textContent='CAPA + Training live data connected • 1,288 CAPA • '+Number(d.records).toLocaleString('en-US')+' training records';
            }catch(e){console.error('Training summary load failed',e)}
          })();
          </script>\n'''
              s=s.replace('</body>',script+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Home fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Fix Home Training live summary"; git push; fi
