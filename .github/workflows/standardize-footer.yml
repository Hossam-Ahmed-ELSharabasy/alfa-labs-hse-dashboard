name: Standardize HSE Footer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply standard footer styling to all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = '''
          /* Global Standard HSE Footer */
          .footer{
            margin-top:22px!important;
            background:#082b52!important;
            color:#fff!important;
            min-height:0!important;
            height:auto!important;
            padding:16px 24px!important;
            display:flex!important;
            align-items:center!important;
            justify-content:center!important;
            gap:18px!important;
            border-top:1px solid rgba(255,255,255,.10)!important;
            text-align:center!important;
          }
          .footer-brand{font-size:16px!important;font-weight:700!important;line-height:1.4!important;letter-spacing:0!important}
          .footer-copy{font-size:12px!important;font-weight:600!important;line-height:1.55!important;text-align:center!important}
          .footer-copy small{font-size:10px!important;font-weight:500!important;opacity:.82!important}
          .footer-en{font-size:10px!important;font-weight:500!important;opacity:.82!important}
          .footer-tag{font-size:12px!important;font-weight:600!important;line-height:1.4!important;white-space:nowrap!important;opacity:.9!important}
          .footer .ar,.footer .eng,.footer .tag{font-size:12px!important;line-height:1.55!important}
          @media(max-width:700px){
            .footer{
              margin-top:16px!important;
              padding:14px 12px!important;
              flex-direction:column!important;
              gap:5px!important;
              text-align:center!important;
            }
            .footer-brand{font-size:14px!important}
            .footer-copy,.footer .ar,.footer .eng,.footer .tag{font-size:10px!important;line-height:1.5!important}
            .footer-copy small{font-size:9px!important}
            .footer-en{font-size:9px!important}
            .footer-tag{white-space:normal!important;max-width:100%!important}
          }
          @media(max-width:390px){
            .footer{padding:12px 10px!important;gap:4px!important}
            .footer-brand{font-size:13px!important}
            .footer-copy,.footer .ar,.footer .eng,.footer .tag{font-size:9px!important}
            .footer-copy small,.footer-en{font-size:8px!important}
          }
          '''
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              marker='/* Global Standard HSE Footer */'
              if marker not in s:
                  s=s.replace('</style>', css+'</style>', 1)
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit footer changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet || git commit -m "Standardize footer across all HSE pages"
          git push
