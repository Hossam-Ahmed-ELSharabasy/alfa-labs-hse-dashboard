name: Standardize Home Labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-home-label.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Home labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('>الرئيسية<', '>Home<').replace('>لوحة السلامة<', '>HSE Management Dashboard<')
          if s2 == s:
              print('No matching labels found; nothing changed.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Home labels updated.')
          PY

      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update Home navigation and dashboard title'
            git push
          fi
