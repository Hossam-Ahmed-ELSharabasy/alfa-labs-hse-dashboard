name: Run Live Report Patch
on:
  push:
    paths:
      - '.github/workflows/report-v2-run.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix live report data mapping') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix live report field mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hse-report-generator.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("group(C,['Risk Severity'])", "group(C,['risk','Risk Severity','Risk'])")
          s=s.replace("group(C,['Status'])", "group(C,['status','Status'])")
          s=s.replace("group(C,['Site Name'])", "group(C,['site','Site Name','siteName'])")
          s=s.replace("group(T,['Training Type','نوع التدريب | Training Type'])", "group(T,['نوع التدريب | Training Type','Training Type','trainingType'])")
          s=s.replace("group(T,['Department','الإدارة / القسم | Department'])", "group(T,['الإدارة / القسم | Department','Department','department'])")
          s=s.replace("['Duration (Hours)','مدة التدريب','Duration']", "['مدة التدريب | Duration (Hours)','Duration (Hours)','مدة التدريب','Duration','duration']")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hse-report-generator.js
          git commit -m 'Fix live report data mapping' || true
          git push
