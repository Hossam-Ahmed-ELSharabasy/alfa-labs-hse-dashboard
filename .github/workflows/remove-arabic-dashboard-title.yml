name: Remove Arabic dashboard title

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-arabic-dashboard-title.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Arabic dashboard title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'لوحة متابعة السلامة': 'HSE Management Dashboard',
              'لوحة السلامة': 'HSE Management Dashboard',
              'لوحة متابعة': 'HSE Management Dashboard',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('Arabic dashboard title removed/replaced.')
          PY
      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Replace Arabic dashboard title with English'
            git push
          fi
